function panelStats(c){const names=new Map(),pot=[1,1,1];let floor=c.weapon.floor/100;for(const e of [c.weapon,...c.armors]){if(e!==c.weapon)e.pot.forEach((v,i)=>pot[i]*=1+v/100);for(const s of e.slots){if(!s)continue;const b=s.ability;pot.forEach((_,i)=>pot[i]*=1+b.pot[i]/100);floor*=1+b.floor/100;names.set(b.name,(names.get(b.name)||0)+1)}}return {pot,floor:Math.min(1,floor),rawFloor:floor,names,kinds:names.size,effective:Math.min(20,names.size),abund5:1.02*(1+.005*Math.min(20,names.size))}}

function renderCompare(){let values=store.rows.map(row=>{let c=clone(row.config);if(store.mode==='unified')c={...clone(store.current),weapon:c.weapon,armors:c.armors,coverage:c.coverage};const r=compute(c,false,'normal'),p=compute(c,true,'normal');return {row,c,r,p,avg:r.expected*(1-c.coverage/100)+p.expected*c.coverage/100}});let b=values.find(v=>v.row.id===store.base)||values[0];const show=(v,key)=>{let val=key==='normal'?v.r.expected:key==='proc'?v.p.expected:v.avg;let den=store.denom==='normal'?b?.r.expected:key==='normal'?b?.r.expected:key==='proc'?b?.p.expected:b?.avg;if(store.display==='value')return fmt(val);if(!den)return '无法比较';return store.display==='percent'?pct(val/den):(val>=den?'+':'')+((val/den-1)*100).toFixed(2)+'%'};

presetLv}</td><td class="number">${show(v,'normal')}<div class="bar" style="width:${Math.min(100,v.r.expected/Math.max(...values.map(x=>x.r.expected))*100)}%"></div></td><td class="number">${show(v,'proc')}${v.r.expected===v.p.expected?'<small style="display:block">无额外伤害变化</small>':''}</td>${store.showAverage?`<td class="number">${show(v,'avg')}<small style="display:block">${v.c.coverage}%有效覆盖</small></td>`:''}<td><div class="actions"><button class="small" onclick="setBase('${v.row.id}')">设为基准</button><button class="small" onclick="loadRow('${v.row.id}')">编辑</button><button class="small" onclick="updateRow('${v.row.id}')">用当前替换</button><button class="small danger" onclick="removeRow('${v.row.id}')">移除</button></div></td></tr>`).join('')}</tbody></table></div>${values.length?'':'<div class="empty">尚无比较项目，添加当前配装或六个内置系列。</div>'}<p class="note">主体伤害不包含独立追击。覆盖率平均按各状态伤害线性加权；请填写实际有效覆盖，默认0%，不自动假定实战频率。</p></div>`}

let optimizingWeapon=false;
async function findBestWeaponNormals(config,abilities,onProgress=()=>{}){
 const c=clone(config),fixed=[0,1,2,6,7].map(i=>c.weapon.slots[i]).filter(Boolean),blocked=new Set(fixed.map(s=>s.ability.group));
 const old=c.weapon.slots.slice(3,6),pool=[],seen=new Set();
 const add=s=>{if(s.ability.kind!=='normal'||blocked.has(s.ability.group))return;const key=JSON.stringify(s);if(!seen.has(key)){seen.add(key);pool.push(clone(s))}};
 // Preserve equipped snapshots and their manually enabled conditions. New abilities
 // use only their unconditional / automatically evaluated effects.
 old.filter(Boolean).forEach(add);
 abilities.filter(a=>a.kind==='normal').forEach(a=>add({ability:a,active:false}));
 const legal=slots=>slots.every(Boolean)&&new Set([...fixed,...slots].map(s=>s.ability.group)).size===fixed.length+3;
 const before=compute(c,false,'normal').expected;
 let best=legal(old)?clone(old):null,bestValue=best?before:-Infinity,checked=0;
 for(let i=0;i<pool.length-2;i++)for(let j=i+1;j<pool.length-1;j++){
  if(pool[i].ability.group===pool[j].ability.group)continue;
  for(let k=j+1;k<pool.length;k++){
   const picks=[pool[i],pool[j],pool[k]];if(!legal(picks))continue;
   c.weapon.slots.splice(3,3,...picks);const value=compute(c,false,'normal').expected;checked++;
   if(value>bestValue+1e-9){bestValue=value;best=clone(picks)}
   if(checked%500===0){onProgress(checked);await new Promise(resolve=>setTimeout(resolve,0))}
  }
 }
 return {slots:best,before,expected:bestValue,checked};
}
async function optimizeWeaponNormals(){
 if(optimizingWeapon)return;optimizingWeapon=true;
 const snapshot=JSON.stringify(store.current),c=clone(store.current);
 const report=message=>{const el=document.getElementById('weaponOptimizeStatus');if(el)el.textContent=message};
 const button=document.getElementById('optimizeWeapon');if(button)button.disabled=true;
 report('正在比较普通能力组合…');
 try{
  await new Promise(resolve=>setTimeout(resolve,0));
  const result=await findBestWeaponNormals(c,allAbilities(),n=>report('已比较 '+n.toLocaleString()+' 个合法组合…'));
  if(JSON.stringify(store.current)!==snapshot){report('配装已变化，本次结果未应用，请重新优化。');return}
  if(!result.slots){report('没有可填满3槽的合法组合，请检查能力互斥组。');return}
  store.current.weapon.slots.splice(3,3,...result.slots);changed();
  report('非倒地常态：'+fmt(result.before)+' → '+fmt(result.expected)+'（'+(result.expected>=result.before?'+':'')+fmt((result.expected/result.before-1)*100)+'%）；已比较 '+result.checked.toLocaleString()+' 组。');
 }catch(error){report('优化未完成：'+error.message)}finally{
  optimizingWeapon=false;const el=document.getElementById('optimizeWeapon');if(el)el.disabled=false;
 }
}

function openSave(type='full',ei=equip){equip=ei;document.getElementById('saveType').value=type;document.getElementById('saveName').value=type==='weapon'?store.current.weapon.name:type==='armor'?equipmentAt(Math.max(1,ei)).name:store.current.name||store.current.weapon.name;document.getElementById('saveDialog').showModal()}
function renderSaved(){document.getElementById('saved').innerHTML=`<div class="sectionline"><h2>我的方案与装备</h2><button class="primary" onclick="openSave()">＋ 保存当前配置</button></div><div class="savedgrid">${store.saved.map(s=>`<article class="savedcard"><span class="badge">${{full:'完整方案',weapon:'武器',armor:'防具',armorset:'防具套装'}[s.type]}</span><h3>${esc(s.name)}</h3><small>${esc(s.date)}</small><div class="actions" style="margin-top:15px">${s.type==='armor'?`<select id="loadTarget_${s.id}" aria-label="加载到哪件防具"><option value="1">防具1</option><option value="2">防具2</option><option value="3">防具3</option></select>`:''}<button onclick="loadSaved('${s.id}')">加载</button>${s.type==='full'?`<button onclick="compareSaved('${s.id}')">加入比较</button>`:''}<button onclick="renameSaved('${s.id}')">改名</button><button class="danger" onclick="deleteSaved('${s.id}')">删除</button></div></article>`).join('')}</div>${store.saved.length?'':'<div class="panel empty">保存第一套配装，随时重新加载或加入比较。</div>'}`}
function loadSaved(sid){const s=store.saved.find(s=>s.id===sid);if(s.type==='full')store.current=clone(s.data);if(s.type==='weapon'){store.current.weapon=clone(s.data);if(getAttack(store.current).weapon!==s.data.type){store.current.attack='normal'+s.data.type;store.current.powerOverride=null}}if(s.type==='armor'){const i=Math.max(0,Number(document.getElementById('loadTarget_'+sid)?.value||equip||1)-1);store.current.armors[i]=clone(s.data);equip=i+1}if(s.type==='armorset')store.current.armors=clone(s.data);changed();switchTab('editor');toast('已加载 '+s.name)}
function compareSaved(sid){const s=store.saved.find(s=>s.id===sid),rid=id();store.rows.push({id:rid,label:s.name,config:clone(s.data)});if(!store.base)store.base=rid;persist();renderCompare();toast('已加入比较列表')}
function renameSaved(sid){let s=store.saved.find(s=>s.id===sid),n=localizedPrompt('新的名称',s.name);if(n?.trim()){s.name=n.slice(0,80);persist();renderSaved()}}
function deleteSaved(sid){if(localizedConfirm('删除这份保存的配置？比较列表中的快照会保留。')){store.saved=store.saved.filter(s=>s.id!==sid);persist();renderSaved()}}
function renderLibrary(){document.getElementById('library').innerHTML=`<div class="sectionline"><div><h2>自定义能力</h2><small>内置${DATA.abilities.length}条能力 · 保存的自定义能力可在装备槽中选择</small></div><button class="primary" onclick="openCustom()">＋ 添加自定义能力</button></div><div class="notice">能力修改和删除只影响能力列表；已保存的配装及当前装备保留效果快照。需要更新时，请在装备槽重新选择。</div><div class="savedgrid">${store.custom.map(a=>`<article class="savedcard"><h3>${esc(a.name)}</h3><p class="note">${abilityText(a)}</p><p class="note">${esc(a.desc)}</p><div class="actions"><button onclick="openCustom('${a.id}')">编辑</button><button onclick="openCustom('${a.id}',true)">复制</button><button class="danger" onclick="deleteCustom('${a.id}')">删除</button></div></article>`).join('')}</div>${store.custom.length?'':'<div class="panel empty">还没有自定义能力。新增后会自动保存到此列表。</div>'}`}
function openCustom(aid=null,copy=false){editingCustom=copy?null:aid;let a=aid?clone(store.custom.find(a=>a.id===aid)):{name:'',kind:'normal',group:'',pot:[0,0,0],floor:0,crit:0,cd:0,atk:0,effect:0,cond:'manual',desc:''};if(copy)a.name+=' 副本';const f=(n,k,v,max=null)=>`<label class="field">${n}<input name="${k}" type="number" step="any" min="0" ${max===null?'':'max="'+max+'"'} value="${v}" required></label>`;document.getElementById('customForm').innerHTML=`<div class="grid two"><label class="field">能力名称<input name="name" value="${esc(a.name)}" maxlength="80" required></label><label class="field">槽位类别<select name="kind">${[['normal','普通能力（武器／防具）'],['ex','EX能力（武器）'],['z','Z专用槽'],['d','D专用槽']].map(([k,n])=>`<option value="${k}" ${a.kind===k?'selected':''}>${n}</option>`).join('')}</select></label>${f('打击威力 +%','p0',a.pot[0])}${f('射击威力 +%','p1',a.pot[1])}${f('法击威力 +%','p2',a.pot[2])}${f('下限 +%','floor',a.floor)}${f('暴击率 +百分点','crit',a.crit,100)}${f('暴击威力 +%','cd',a.cd)}${f('固定攻击力 +','atk',a.atk)}${f('条件威力 +%','effect',a.effect)}<label class="field">生效条件<select name="cond">${[['manual','手动开关'],['weak','弱点部位或弱点属性'],['down','倒地（含BK）'],['highhp','HP≥95%'],['lowhp','HP≤50%'],['lowpp','PP≤70%']].map(([k,n])=>`<option value="${k}" ${a.cond===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">互斥组（留空按名称）<input name="group" value="${esc(a.group)}" maxlength="80"></label><label class="field full">效果说明<input name="desc" value="${esc(a.desc)}" maxlength="500"></label></div><p class="note">填加成数值：例如威力+7%填写7；不填107。此功能用于自定义数值，不限制为已实装能力。</p><button class="primary">保存能力</button>`;document.getElementById('customDialog').showModal()}
function deleteCustom(aid){if(localizedConfirm('从能力列表删除？已有配装中的快照会保留。')){store.custom=store.custom.filter(a=>a.id!==aid);persist();renderLibrary()}}
function exportAll(){const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='NGS伤害计算器备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出全部配置与自定义能力')}
function validateStore(x){if(!x||x.version!==1||!Array.isArray(x.custom)||!Array.isArray(x.saved)||!Array.isArray(x.rows)||!x.current)throw Error('不是本计算器V1备份');if(x.rows.length>500||x.custom.length>3000||x.saved.length>1000)throw Error('项目数量超出限制');
 function walk(o){if(o&&typeof o==='object')for(const k of Object.keys(o)){if(['__proto__','prototype','constructor'].includes(k))throw Error('非法字段');walk(o[k])}else if(typeof o==='number'&&!Number.isFinite(o))throw Error('数值无效')}walk(x);
 function ability(a){if(!a||typeof a.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(a.id)||typeof a.name!=='string'||!Array.isArray(a.pot)||a.pot.length!==3||!['normal','ex','z','d'].includes(a.kind))throw Error('能力数据无效');for(const v of [...a.pot,a.floor,a.crit,a.cd,a.atk,a.effect])if(typeof v!=='number'||v<0||v>1e7)throw Error('能力数值无效')}
 function equipment(e,weapon){if(!e||typeof e.name!=='string'||!Array.isArray(e.slots)||e.slots.length!==8)throw Error('装备数据无效');e.slots.forEach(s=>{if(s){ability(s.ability);const a=s.ability;if(!a.custom&&a.name.endsWith('/S')&&a.jp?.endsWith('/MN'))a.jp=a.jp.slice(0,-3)+'/S'}});if(weapon){if(!Number.isInteger(e.type)||!WEAPONS[e.type])throw Error('武器类型无效');for(const k of ['atk','potential','floor','crit','procCrit','procCd','procPot'])if(typeof e[k]!=='number'||e[k]<0||e[k]>1e7)throw Error('武器数值无效');if(!PRESETS.some(p=>p[0]===e.preset))throw Error('固有能力无效')}else if(!Array.isArray(e.pot)||e.pot.length!==3||e.pot.some(v=>typeof v!=='number'||v<0||v>1e7))throw Error('防具威力无效')}
 function config(c){let d=defaults();for(const k of Object.keys(d))if(!(k in c))throw Error('配置缺少字段 '+k);if(!DATA.levels[c.level]||!JOBS.some(j=>j[0]===c.job)||!(c.sub==='none'||JOBS.some(j=>j[0]===c.sub))||!ATTACKS.some(a=>a.id===c.attack)||!RINGS.some(r=>r[0]===c.ring))throw Error('角色或攻击数据无效');if(!Array.isArray(c.armors)||c.armors.length!==3)throw Error('防具数量无效');equipment(c.weapon,true);c.armors.forEach(e=>equipment(e,false));for(const [k,v] of Object.entries(d))if(typeof v==='number'&&(typeof c[k]!=='number'||c[k]<0||c[k]>1e7))throw Error('参数数值无效 '+k);for(const k of ['atkOverride','powerOverride'])if(c[k]!==null&&(typeof c[k]!=='number'||c[k]<0||c[k]>1e7))throw Error('覆盖数值无效');if(!Number.isInteger(c.ringLv)||c.ringLv>5)throw Error('戒指等级无效');if(c.coverage>100||c.hp>100||c.pp>100)throw Error('比例不能超过100%')}
 config(x.current);x.rows.forEach(r=>{if(typeof r.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(r.id)||typeof r.label!=='string')throw Error('比较项目无效');config(r.config)});x.custom.forEach(ability);x.saved.forEach(s=>{if(typeof s.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(s.id)||typeof s.name!=='string')throw Error('保存名称无效');if(s.type==='full')config(s.data);else if(s.type==='weapon')equipment(s.data,true);else if(s.type==='armor')equipment(s.data,false);else if(s.type==='armorset'&&s.data.length===3)s.data.forEach(e=>equipment(e,false));else throw Error('保存类型无效')});if(!['value','percent','delta'].includes(x.display)||!['same','normal'].includes(x.denom)||!['unified','snapshot'].includes(x.mode))throw Error('比较设置无效')}
function renderHelp(){document.getElementById('help').innerHTML=`<div class="panel"><h2>使用与计算说明</h2><ol><li>设置角色、敌人和增益；顶部面板与伤害结果实时刷新。</li><li>武器与三件防具同屏显示，点击能力名称选择。能力效果默认常驻部分生效；手动条件需勾选。</li><li>选择单次命中攻击，保存方案或加入比较。</li><li>比较页可设基准、切换百分比、添加六系列。浏览器会自动保存，另可导出完整备份。</li></ol><div class="notice">这是单次命中伤害计算器。不会模拟完整技能循环、PP续航、潜在触发时间轴或队伍追击频率。条件性职业技能请按实际填写；所有独立追击均不自动并入主体伤害。</div><h3>期望值与显示</h3><p>期望＝非暴击平均×（1−暴击率）＋暴击伤害×暴击率。下限和暴击率封顶100%；暴击使用武器攻击力上限。中途保留小数，单次伤害最终四舍五入。期望使用均匀武器浮动下的整数伤害概率，显示两位小数。极端低伤害按最少1点处理。</p><p>本工具默认不模拟低等级区域攻击力上限、等级差衰减和任务特殊补正。需要复现实测时，请确认该任务没有此类限制，并设置正确部位、距离及职业倍率。</p><h3>固有与条件</h3><p>固有·光子爆发在当前普攻／PA选项中仅计常驻部分。固有·种类丰盛按整套配装不同能力名称统计；同名不重复计数，最多按20种计算增伤。防具固有中的PP、减伤、PB效果保存但不直接加成单次伤害。</p><h3>数据来源</h3><ul><li>能力：上传的NGS能力计算比较表V6；EXⅢ数据沿用原表，原始日文名与说明保留在内置数据中。</li><li>攻击与1～120级职业攻击力：上传的Lyco中文V2表，攻击选项注明原单元格位置。</li><li>戒指：内置T1戒指数据；中文名为本工具释义，日文名如下。</li><li>武器：强化＋100、潜在Lv.6，见下表。改变内置数值后视为你的手动覆盖。</li></ul><div class="tablewrap"><table><tr><th>武器</th><th>攻击力</th><th>潜在倍率</th><th>基础下限</th></tr>${SERIES.map(s=>`<tr><td>${s.name}</td><td>${s.atk}</td><td>${s.potential}%</td><td>${s.floor}%</td></tr>`).join('')}</table></div><details><summary>T1戒指中日对照</summary>${RINGS.filter(r=>r[2]).map(r=>`<p class="note">${r[1]}：タイプ1／${r[2]}</p>`).join('')}</details><h3>离线保存</h3><p>文件不请求任何外部脚本、字体或接口。浏览器缓存清理、隐私模式、文件路径变化可能影响本地存档，请用右上角“导出备份”保留配置。导入会先校验，再确认是否替换当前数据。</p></div>`}
function switchTab(t){tab=t;for(const n of ['editor','compare','saved','library','help'])document.getElementById(n).hidden=n!==t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='saved')renderSaved();if(t==='library')renderLibrary();if(t==='compare')renderCompare();if(t==='help')renderHelp()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.path){if(!el.checkValidity()){el.reportValidity();return}const p=el.dataset.path;let v=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''&&el.dataset.nullable?null:num(el.value)):el.value;if(['ringLv','weapon.presetLv','weapon.type'].includes(p)||p.endsWith('.presetLv'))v=Number(v);setPath(p,v);if(p==='attack'){store.current.powerOverride=null;store.current.weapon.type=getAttack(store.current).weapon}if(p==='weapon.type'){store.current.attack='normal'+v;store.current.powerOverride=null}changed()}if(el.dataset.slot!==undefined){equipmentAt(Number(el.dataset.equip??equip)).slots[Number(el.dataset.slot)].active=el.checked;changed()}if(el.dataset.store){store[el.dataset.store]=el.type==='checkbox'?el.checked:el.value;persist();renderCompare()}});
document.getElementById('searchAbility').addEventListener('input',renderPicker);
document.getElementById('saveForm').addEventListener('submit',e=>{e.preventDefault();const type=document.getElementById('saveType').value,name=document.getElementById('saveName').value.trim();if(!name)return;store.current.name=name;let data=type==='full'?store.current:type==='weapon'?store.current.weapon:type==='armor'?store.current.armors[Math.max(0,equip-1)]:store.current.armors;store.saved.push({id:id(),name,type,data:clone(data),date:new Date().toLocaleString('zh-CN')});persist();closeDialog('saveDialog');renderSaved();toast('已保存 '+name)});
document.getElementById('customForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim();if(!name)return;const duplicate=allAbilities().find(a=>a.name===name&&a.id!==editingCustom);if(duplicate){toast('能力名称已存在，请换一个名称');return}const a={id:editingCustom||'custom'+id(),name,jp:'',kind:f.get('kind'),group:String(f.get('group')).trim()||name,pot:[0,1,2].map(i=>num(f.get('p'+i))),floor:num(f.get('floor')),crit:num(f.get('crit')),cd:num(f.get('cd')),atk:num(f.get('atk')),effect:num(f.get('effect')),cond:f.get('cond'),desc:String(f.get('desc')),source:'用户自定义',custom:true};if(editingCustom)store.custom[store.custom.findIndex(a=>a.id===editingCustom)]=a;else store.custom.push(a);persist();closeDialog('customDialog');renderLibrary();toast('能力已保存，可在对应槽位选择')});

const languageOriginals=new WeakMap();
